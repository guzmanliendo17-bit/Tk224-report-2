<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TK224 Report</title>

<style>
body{
  font-family: Arial;
  background:#e30a17;
  color:white;
  margin:0;
  padding:20px;
  display:flex;
  justify-content:center;
}
.container{max-width:700px;width:100%;}

.header{
  display:flex;
  align-items:center;
  gap:10px;
}

.header img{
  height:40px;
  background:white;
  padding:5px;
  border-radius:6px;
}

textarea{
  width:100%;
  height:400px;
  border:none;
  border-radius:10px;
  padding:10px;
  font-family:monospace;
}

button{
  border:none;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
  margin-right:5px;
  margin-top:10px;
}

.copy{background:black;color:white;}
.wa{background:#25D366;color:white;}
.calc{background:#0033a0;color:white;}
.reset{background:white;color:black;}

.result{
  margin-top:10px;
  padding:10px;
  background:rgba(0,0,0,0.2);
  border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<img src="https://www.turkishairlines.com/assets/images/turkish-airlines-logo.svg">
<h2>TK224 Report</h2>
</div>

<textarea id="text">
TK224
Landing: 22:00
In: 22:12
Door open: 22:20
Disembark: 22:20 - 22:33
Crew out: 22:34
Cleaning: 22:35 - 23:20
Catering: 22:48 - 23:05
Fueling: 22:50 - 22:41
Canino: 23:13 - 23:25
Crew In: 23:20
Security: 23:40 - 23:54
Boarding: 23:54 - 00:14
Push back: 00:28
Take off: 00:40
</textarea>

<div>
<button class="copy" onclick="copyText()">Copiar</button>
<button class="wa" onclick="whatsapp()">WhatsApp</button>
<button class="calc" onclick="calc()">Calcular ⏱️</button>
<button class="reset" onclick="reset()">Reset</button>
</div>

<div class="result" id="result">Duración: --</div>

</div>

<script>
function timeToMin(t){
  let [h,m]=t.split(":").map(Number);
  return h*60+m;
}

function calc(){
  let lines=document.getElementById("text").value.split("\n");
  let total=0;

  lines.forEach(l=>{
    let m=l.match(/(\d{2}:\d{2})\s*-\s*(\d{2}:\d{2})/);
    if(m){
      let s=timeToMin(m[1]);
      let e=timeToMin(m[2]);
      if(e<s)e+=1440;
      total+=e-s;
    }
  });

  document.getElementById("result").innerText=
  "Duración: "+Math.floor(total/60)+"h "+(total%60)+"m";
}

function copyText(){
  navigator.clipboard.writeText(document.getElementById("text").value);
  alert("Copiado");
}

function whatsapp(){
  let t=document.getElementById("text").value;
  window.open("https://wa.me/?text="+encodeURIComponent(t));
}

function reset(){
  location.reload();
}
</script>

</body>
</html>
